services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-linkr}
      POSTGRES_USER: ${POSTGRES_USER:-linkr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkr}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linkr} -d ${POSTGRES_DB:-linkr}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: uv run python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/workspace
    working_dir: /workspace
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-linkr}:${POSTGRES_PASSWORD:-linkr}@db:5432/${POSTGRES_DB:-linkr}
      DJANGO_DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
