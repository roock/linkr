[project]
name = "linkr"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.3",
    "django-htmx>=1.29.0",
    "psycopg[binary]>=3.3.9",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "linkr.settings"
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
